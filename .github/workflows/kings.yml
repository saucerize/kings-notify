name: キングス速報

on:
  schedule:
    - cron: "10,30,50 1-11 * * *"   # 日本時間 10:10〜20:50 に20分おきに起動(定期起動は遅れたり飛んだりするので多めに)
  workflow_dispatch:
    inputs:
      test:
        description: "テスト通知を送る"
        type: boolean
        default: true

concurrency:
  group: kings
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 実行
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.test }}" = "true" ]; then
            python notifier.py --test
          else
            python notifier.py
          fi
